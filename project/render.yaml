services:
  # Backend Node.js Server
  - type: web
    name: collabboard-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      # Redis is optional. If you provision a Redis instance on Render, add the REDIS_URL here.

  # Frontend Static Site
  - type: web
    name: collabboard-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: collabboard-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
